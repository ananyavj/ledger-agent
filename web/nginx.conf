# Serves the built React app and forwards /api/... to the FastAPI container.
# The browser only ever talks to this one origin, so no CORS setup is needed.
server {
    listen 80;
    root /usr/share/nginx/html;

    client_max_body_size 6m;              # contract uploads are allowed up to 5 MB

    location /api/ {
        proxy_pass http://api:8000/;     # trailing slash strips the /api prefix
        proxy_read_timeout 180s;          # LLM calls can be slow on the free tier
    }

    location / {
        try_files $uri /index.html;       # single-page app: every route serves index.html
    }
}
