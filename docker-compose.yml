services:
  db:
    # Official Postgres with the pgvector extension pre-installed
    image: pgvector/pgvector:pg17
    container_name: collections-db
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # host:container. 5433 on your laptop, so it can't clash with a
      # Postgres you may already have installed on the default 5432.
      - "5433:5432"
    volumes:
      # Named volume: data survives `docker compose down` / restarts
      - pgdata:/var/lib/postgresql/data
      # Scripts here run ONCE, the first time the volume is empty
      - ./db/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
